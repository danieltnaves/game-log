<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finished Games Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    /* Layout: stats strip, toolbar, then a grid of cover cards. Details and forms open in a bevelled window. */
    --void: #07070d;
    --slate: #8c90a4;
    --panel: #c4c7d4;
    --ink: #12121c;
    --cobalt: #2f45e0;
    --signal: #ffb21a;
    --danger: #b3261e;
    --display: 'Pixelify Sans', 'Courier New', monospace;
    --body: 'VT323', 'Courier New', monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--void);
    background-image: conic-gradient(#0c0c18 25%, transparent 0 50%, #0c0c18 0 75%, transparent 0);
    background-size: 8px 8px;
    color: var(--panel);
    font-family: var(--body);
    font-size: 22px;
    line-height: 1.25;
  }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 20px; margin-bottom: 16px; }
  h1 {
    margin: 0;
    font: 700 clamp(34px, 7vw, 60px) / .95 var(--display);
    letter-spacing: .04em; color: #fff;
    text-shadow: 3px 3px 0 var(--cobalt), 6px 6px 0 #000;
  }
  .sub { margin: 0; color: var(--slate); font-size: 20px; }

  /* Bevelled blocks */
  .bevel-out { border: 2px solid; border-color: #fff #5a5d70 #5a5d70 #fff; }
  .bevel-in { border: 2px solid; border-color: #5a5d70 #fff #fff #5a5d70; }

  .warn { margin: 0 0 12px; padding: 6px 10px; background: #000; color: #ff8a80; }

  /* List */
  .grid { display: flex; flex-direction: column; gap: 14px; }
  .item {
    display: flex; flex-direction: row; align-items: flex-start; gap: 16px; padding: 10px;
    color: var(--ink); background: var(--panel);
    border: 2px solid; border-color: #fff #5a5d70 #5a5d70 #fff;
    box-shadow: 0 0 0 2px #000, 4px 4px 0 2px rgba(0,0,0,.6);
  }
  .cover {
    position: relative; flex: none; width: 200px; min-height: 140px; overflow: hidden; background: #000;
    border: 2px solid; border-color: #5a5d70 #fff #fff #5a5d70;
    display: flex; align-items: center; justify-content: center;
  }
  .cover img { width: 100%; height: auto; max-height: 340px; object-fit: contain; display: block; }
  .cover .ph { font: 700 44px var(--display); color: rgba(255,255,255,.92); text-shadow: 3px 3px 0 rgba(0,0,0,.55); letter-spacing: .04em; }
  .item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .item h3 { margin: 0 0 4px; font: 700 24px/1.15 var(--display); overflow-wrap: anywhere; }
  .item .line { color: #4a4d60; font-size: 21px; }
  .item .line b { color: var(--ink); font-weight: normal; }
  .item .pnotes { margin: 4px 0 0; color: var(--ink); overflow-wrap: anywhere; }
  @media (max-width: 520px) { .item { flex-direction: column; } .cover { width: 100%; max-width: 260px; } }
  .empty { padding: 28px 16px; text-align: center; background: #14141f; border: 2px dashed #3a3d52; color: var(--slate); }

  footer { margin-top: 28px; padding-top: 12px; border-top: 2px solid #2a2a40; color: var(--slate); font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GAME LOG</h1>
  </header>

  <main><div class="grid" id="grid"></div></main>

  <footer><a href="docs.html" style="color:var(--signal)">How to add games</a> &middot; Cover images from <a href="https://rawg.io" target="_blank" rel="noopener" style="color:var(--signal)">RAWG</a>.</footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var fmtDate = function (s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return '\u2013';
    return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  };
  var hue = function (s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; };
  var initials = function (t) {
    var w = t.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
    return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 2)).toUpperCase();
  };
  function coverHtml(g) {
    var bg = 'background:hsl(' + hue(g.title) + ',45%,32%)';
    var inner = g.cover
      ? '<img src="' + esc(g.cover) + '" alt="Cover of ' + esc(g.title) + '" loading="lazy" onerror="this.remove()">'
      : '<span class="ph">' + esc(initials(g.title)) + '</span>';
    return '<div class="cover" style="' + bg + '">' + inner + '</div>';
  }
  /* In-progress games first, then newest finished first; later entries first on the same date. */
  function sorted(games) {
    return games.map(function (g, i) { return { g: g, i: i }; }).sort(function (a, b) {
      return (b.g.status ? 1 : 0) - (a.g.status ? 1 : 0) || (b.g.finished || '').localeCompare(a.g.finished || '') || b.i - a.i;
    }).map(function (o) { return o.g; });
  }

  function render(games) {
    var grid = $('#grid');
    if (!games.length) { grid.innerHTML = '<div class="empty">No games to show yet.</div>'; return; }
    grid.innerHTML = sorted(games).map(function (g) {
      return '<article class="item" role="button" tabindex="0" data-id="' + esc(g.id) + '">' + coverHtml(g) +
        '<div class="body"><h3>' + esc(g.title) + '</h3>' +
        '<span class="line"><b>Platform:</b> ' + esc(g.platform || '\u2013') + '</span>' +
        '<span class="line"><b>Genre:</b> ' + esc(g.genre || '\u2013') + '</span>' +
        (g.status ? '<span class="line"><b>Status:</b> ' + esc(g.status) + '</span>' : '<span class="line"><b>Finished:</b> ' + esc(fmtDate(g.finished)) + '</span>') +
        (g.notes ? '<p class="pnotes">' + esc(g.notes) + '</p>' : '') + '<span class="more">' + (g.trailer ? 'Trailer and ' : '') + 'Screenshots &raquo;</span></div></article>';
    }).join('');
  }

  /* ---------- details window ---------- */
  var all = [], opener = null, overlay = $('#overlay'), win = $('#win');
  function openDetail(id) {
    var g = all.filter(function (x) { return x.id === id; })[0]; if (!g) return;
    var shots = Array.isArray(g.screenshots) ? g.screenshots : [];
    var h = '<h2 id="win-title">' + esc(g.title) + '</h2><div class="facts">' +
      '<span><b>Platform:</b> ' + esc(g.platform || '\u2013') + '</span><span><b>Genre:</b> ' + esc(g.genre || '\u2013') + '</span>' +
      (g.status ? '<span><b>Status:</b> ' + esc(g.status) + '</span>' : '<span><b>Finished:</b> ' + esc(fmtDate(g.finished)) + '</span>') +
      '</div>';
    if (g.trailer) h += '<h4>TRAILER</h4><video controls preload="none" playsinline' + (g.trailerPreview ? ' poster="' + esc(g.trailerPreview) + '"' : '') + ' src="' + esc(g.trailer) + '"></video>';
    h += '<h4>SCREENSHOTS</h4>';
    if (shots.length) {
      h += '<img class="shot" id="shot" src="' + esc(shots[0]) + '" alt="Screenshot of ' + esc(g.title) + '"><div class="thumbs">' +
        shots.map(function (u, i) { return '<button type="button" data-shot="' + esc(u) + '" aria-label="Screenshot ' + (i + 1) + '"' + (i === 0 ? ' aria-current="true"' : '') + '><img src="' + esc(u) + '" alt="" loading="lazy"></button>'; }).join('') + '</div>';
    } else h += '<p class="none">No screenshots available for this game.</p>';
    h += '<div class="row"><button class="btn" type="button" data-close autofocus>CLOSE</button></div>';
    opener = document.activeElement; win.innerHTML = h; overlay.hidden = false;
    document.body.style.overflow = 'hidden'; overlay.scrollTop = 0;
    var c = win.querySelector('[data-close]'); if (c) c.focus();
  }
  function closeWin() {
    overlay.hidden = true; win.innerHTML = ''; document.body.style.overflow = '';
    if (opener && document.contains(opener)) opener.focus();
  }
  overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) closeWin(); });
  win.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-close')) { closeWin(); return; }
    if (b.dataset.shot) {
      $('#shot').src = b.dataset.shot;
      Array.prototype.forEach.call(win.querySelectorAll('.thumbs button'), function (x) { x.removeAttribute('aria-current'); });
      b.setAttribute('aria-current', 'true');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (overlay.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeWin(); return; }
    if (e.key === 'Tab') {
      var f = Array.prototype.slice.call(win.querySelectorAll('button,video')).filter(function (el) { return el.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $('#grid').addEventListener('click', function (e) { var a = e.target.closest('[data-id]'); if (a) openDetail(a.dataset.id); });
  $('#grid').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var a = e.target.closest('[data-id]'); if (a && e.target === a) { e.preventDefault(); openDetail(a.dataset.id); }
  });

  fetch('games.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (a) { all = Array.isArray(a) ? a.filter(function (g) { return g && g.title; }) : []; render(all); })
    .catch(function () {
      $('#grid').innerHTML = '<div class="empty">Could not load games.json. Open this page through a web server, not as a file.</div>';
    });
})();
</script>
</body>
</html>
