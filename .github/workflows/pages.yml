name: Manage games and deploy

# Name shown for each run in the Actions tab, e.g. "Remove game: Hades".
run-name: "${{ github.event_name == 'workflow_dispatch' && format('{0} game: {1}', inputs.action, inputs.title) || format('Deploy site ({0})', github.event.head_commit.message) }}"

on:
  # Every push to main publishes the site.
  push:
    branches: [main]
  # Run manually from the Actions tab to add a game (fill in the form).
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        default: add
        options:
          - add
          - update
          - remove
          - search
      title:
        description: Game title. For update and remove it must match a game already in the list.
        required: true
        type: string
      platform:
        description: Platform you played on, e.g. PS5, SNES, PC (add, update)
        required: false
        type: string
      genre:
        description: Genre text shown on the page (add, update)
        required: false
        type: string
      finished:
        description: Date finished as YYYY-MM-DD (add, update)
        required: false
        type: string
      status:
        description: 'Type "In progress" for an unfinished game, or "Done" to mark a game as finished (add, update)'
        required: false
        type: string
      notes:
        description: Short note shown under the game (add, update)
        required: false
        type: string
      rawg_id:
        description: Exact RAWG game id (add; or update with refresh_media)
        required: false
        type: string
      refresh_media:
        description: Update only. Fetch the cover, trailer and screenshots again from RAWG.
        required: false
        type: boolean
        default: false

# One run at a time, so two additions never overwrite each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  manage-game:
    name: "${{ inputs.action }} game"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: "${{ inputs.action }} game ${{ inputs.title }}"
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          ACTION: ${{ inputs.action }}
          TITLE: ${{ inputs.title }}
          PLATFORM: ${{ inputs.platform }}
          GENRE: ${{ inputs.genre }}
          FINISHED: ${{ inputs.finished }}
          STATUS: ${{ inputs.status }}
          NOTES: ${{ inputs.notes }}
          RAWG_ID: ${{ inputs.rawg_id }}
          REFRESH: ${{ inputs.refresh_media }}
        run: |
          set -euo pipefail
          if [ "$ACTION" != "remove" ] && [ -z "$RAWG_API_KEY" ]; then
            echo "::error::Add the RAWG_API_KEY secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          args=("$TITLE")
          case "$ACTION" in
            search) python3 tools/add_game.py "${args[@]}" --search | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            remove) python3 tools/add_game.py "${args[@]}" --remove; exit 0 ;;
            update) args+=(--update) ;;
          esac
          if [ -n "$PLATFORM" ]; then args+=(--platform "$PLATFORM"); fi
          if [ -n "$GENRE" ]; then args+=(--genre "$GENRE"); fi
          if [ -n "$FINISHED" ]; then args+=(--finished "$FINISHED"); fi
          if [ -n "$STATUS" ]; then args+=(--status "$STATUS"); fi
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); fi
          if [ -n "$RAWG_ID" ]; then args+=(--rawg-id "$RAWG_ID"); fi
          if [ "$ACTION" = "update" ] && [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          python3 tools/add_game.py "${args[@]}"

      - name: Save the change to games.json and index.html
        if: ${{ inputs.action != 'search' }}
        env:
          ACTION: ${{ inputs.action }}
          TITLE: ${{ inputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json index.html
          if git diff --cached --quiet; then echo "No changes to save."; exit 0; fi
          case "$ACTION" in
            add) verb="Add" ;;
            update) verb="Update" ;;
            remove) verb="Remove" ;;
            *) verb="$ACTION" ;;
          esac
          git commit -m "$verb game: $TITLE"
          git push origin HEAD:main

  deploy:
    needs: manage-game
    name: deploy site
    # Run after a push, or after a manual run that added a game (not a search-only run).
    if: ${{ !cancelled() && needs.manage-game.result != 'failure' && !(github.event_name == 'workflow_dispatch' && inputs.action == 'search') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Build the page and collect the site files
        run: |
          python3 tools/build_site.py
          mkdir _site
          cp index.html docs.html games.json _site/
          cp -r covers _site/covers

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
      # GitHub sometimes does not list the fresh artifact right away. Wait and try once more.
      - name: Retry deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
